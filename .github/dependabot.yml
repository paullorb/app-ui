version: 2

# Two ecosystems: npm for the one devDependency (oxlint, which gates every pull
# request through `npm run check`), and github-actions for the pinned actions.
# package.json declares no runtime dependencies — the shared UI boundary is
# source, not a package with a tree — so the npm entry only ever proposes
# oxlint and its lockfile entries. CI installs the exact lockfile version, so
# without this entry a lint fix or security advisory would never be proposed.
#
# ci.yml's actions ARE pinned by full commit SHA, which means nothing moves them
# unless something does it deliberately. Nothing did: there was no
# dependabot.yml here. This repo is quiet (one pull request in two months),
# which makes it exactly the kind of place where a pin ages unnoticed for a
# year.
#
# No reusable workflow from paullorb/cicd here, and none is coming: app-ui is
# public and cicd's reusable workflows are private, so GitHub will not let a
# public repository call them — there is no such pin for Dependabot to ignore.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Same default-days cooldown as the actions below.
    cooldown:
      default-days: 3
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # An action runs with the job's own reach, so a freshly published SHA is not
    # something to adopt within hours of publish.
    # default-days only: GitHub Actions does not support the semver-*-days
    # cooldowns, and Dependabot rejects the whole file if one is set here.
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"
