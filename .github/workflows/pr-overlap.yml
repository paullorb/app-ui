name: PR overlap

# Comments on a pull request with the other open pull requests that change the
# same files, so whoever merges second knows what is in flight. The reasoning
# and the incidents behind it are in the reusable workflow in paullorb/cicd.
#
# Informational on purpose: it never blocks a merge, so it is not one of the
# checks the "main protection" ruleset requires. The enforcement half of the
# same problem is that ruleset's up-to-date requirement.
on:
  pull_request:
    # `closed` too: the comments on the pull requests this one overlapped are
    # rewritten without it once it merges.
    types: [opened, reopened, synchronize, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Only the newest push's answer is worth having: an overlap computed against
  # a head that has been replaced is wrong, not merely old.
  group: pr-overlap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  overlap:
    # A fork's pull request gets no write token, so no comment either.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: paullorb/cicd/.github/workflows/pr-overlap.yml@f3accf1d4299ed5692924b24bb7bd6d2d8dd9f16
    with:
      ignore: |
        package-lock.json
      # This repository has no runner of its own; it is public, so hosted
      # minutes are free.
      runs_on: '["ubuntu-latest"]'
    permissions:
      contents: read
      pull-requests: write
