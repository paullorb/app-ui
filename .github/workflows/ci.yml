name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only the ones based on main: a PR stacked on
  # another PR's branch gets the same checks, which is what the up-to-date
  # rule on main relies on.
  pull_request:

concurrency:
  # One run per pull-request branch, newest wins. On main every commit gets its
  # own group: a shared group holds only one pending run, so a third push
  # would cancel the second commit's run before it ever started.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pipeline:
    name: CI
    # Reusable pipeline shared across paullorb repos. Lint, audit, build
    # (here `build` IS `check`), and a replay of supabase/migrations/ onto a
    # scratch Postgres — a no-op here, app-ui has no database. No secrets.
    uses: paullorb/cicd/.github/workflows/app-ci.yml@86018ab77a3353da772ac1b63a5a4be9bf75767b
    with:
      node_version_file: .nvmrc
