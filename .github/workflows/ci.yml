name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only the ones based on main: a PR stacked on
  # another PR's branch gets the same checks, which is what the up-to-date
  # rule on main relies on.
  pull_request:

concurrency:
  # One run per pull-request branch, newest wins. On main every commit gets its
  # own group: a shared group holds only one pending run, so a third push
  # would cancel the second commit's run before it ever started.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pipeline:
    name: CI
    # Reusable pipeline shared across paullorb repos: lint, audit and build
    # (the migration replay is a no-op here, there is no supabase directory).
    # paullorb/cicd is public now, so this public repository can call it like
    # every other one. No secrets. CI_LABELS routes it to a hosted runner.
    uses: paullorb/cicd/.github/workflows/app-ci.yml@f3accf1d4299ed5692924b24bb7bd6d2d8dd9f16
    with:
      node_version_file: .nvmrc
