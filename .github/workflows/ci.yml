name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only the ones based on main: a PR stacked on
  # another PR's branch gets the same checks, which is what the up-to-date
  # rule on main relies on.
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - run: npm ci
      - run: npm run check
