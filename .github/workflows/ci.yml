name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only the ones based on main: a PR stacked on
  # another PR's branch gets the same checks, which is what the up-to-date
  # rule on main relies on.
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - run: npm ci
      - run: npm run check
